name: consistency_test

on:
  push:
    branches:
      - 'main'
    paths:
      - 'cnn_lib/**'
      - 'docker/**'
      - '.github/workflows/consistency_test.yml'
      - "!**.md"
  pull_request:
    branches:
      - '*'
    paths:
      - 'cnn_lib/**'
      - 'docker/**'
      - '.github/workflows/consistency_test.yml'
      - "!**.md"

jobs:
  consistency-test:
    name: build docker and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download test data
        run: |
          pip install zenodo_get && \
          zenodo_get 7040177 -o /tmp/ && \
          7z x /tmp/venus_clouds_v1.0.7z -o/tmp/training_data && \
          rm /tmp/training_data/training_set_clouds_multiclass/s*
      - name: Pull the pinned image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=$(cat docker/image.txt)
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: pytest
        run: |
          set -o pipefail
          # Every flag below has to match the recording step in
          # record_kernel_profiles.yml exactly. The comparison is byte-exact
          # on an inference-mode val_loss at batch_size=1, and FCN at 199M
          # parameters is sensitive enough to notice the allocator arena count
          # and the memory limit: recorded one way and verified the other, it
          # disagreed every time while the other fourteen outputs matched.
          # One container per test function, for the same reason - that is how
          # the references were recorded.
          for t in test_001a_plain_architectures \
                   test_001b_deeplab_backbones \
                   test_001c_fcn_backbone \
                   test_002_loss \
                   test_003_augmentation; do
            echo "::group::$t"
            docker run --rm -v /tmp:/tmp:rw -v ${GITHUB_WORKSPACE}:/src:rw \
              -e PYTHONPATH=/usr/local/lib/python3.6/dist-packages:/usr/local/lib/python3/dist-packages:/src \
              -e MALLOC_ARENA_MAX=2 \
              --cpus=4 -m 20g "$IMAGE" \
              bash -c "cd src; pip install .; \
                pytest cnn_lib/test/consistency_test.py::TestCmd::$t" || exit 1
            echo "::endgroup::"
          done
