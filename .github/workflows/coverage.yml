name: coverage

on:
  push:
    branches:
      - 'main'
    paths:
      - 'cnn_lib/**'
      - 'docker/**'
      - '.github/workflows/coverage.yml'
      - "!**.md"
  pull_request:
    branches:
      - '*'
    paths:
      - 'cnn_lib/**'
      - 'docker/**'
      - '.github/workflows/coverage.yml'
      - "!**.md"

jobs:
  consistency-test:
    name: build docker and run tests
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download test data
        run: |
          pip install zenodo_get && \
          zenodo_get 7040177 -o /tmp/ && \
          7z x /tmp/venus_clouds_v1.0.7z -o/tmp/training_data && \
          rm /tmp/training_data/training_set_clouds_multiclass/s*
      - name: Pull the pinned image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/ctu-geoforall-lab/cnn-lib-cpu@sha256:4a62ada6f011b471e50dc8256f7243accae374b9cc0396eab7a1489c01509baa
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: pytest
        run: |
          # data directory is restored from a pristine copy before each test
          cp -a /tmp/training_data /tmp/training_data.pristine

          for t in test_001a_plain_architectures \
                   test_001b_deeplab_backbones \
                   test_001c_fcn_backbone \
                   test_002_loss \
                   test_003_augmentation; do
            echo "::group::$t"
            sudo rm -rf /tmp/training_data
            sudo cp -a /tmp/training_data.pristine /tmp/training_data

            docker run --rm -v /tmp:/tmp:rw -v ${GITHUB_WORKSPACE}:/src:rw -e PYTHONPATH=/usr/local/lib/python3.6/dist-packages:/usr/local/lib/python3/dist-packages:/src --cpus=4 -m 20g "$IMAGE" bash -c "cd src; pip install .; pytest --cov-report=term-missing:skip-covered --junitxml=/tmp/pytest-$t.xml --cov=cnn_lib --cov-config=cnn_lib/test/.coveragerc cnn_lib/test/consistency_test.py::TestCmd::$t" | tee -a /tmp/pytest-coverage.txt
          done
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: /tmp/pytest-coverage.txt
          junitxml-path: /tmp/pytest.xml
